services:
  - type: web
    name: antigena-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python antigena_defense/api/api.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.9
      - key: PORT
        value: 8000
    healthCheckPath: /health
    autoDeploy: true
